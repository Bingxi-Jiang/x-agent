<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>X Agent Capture settings</title>
    <style>
      body { max-width: 680px; margin: 48px auto; padding: 0 20px; color: #17211b; font: 15px/1.5 system-ui, sans-serif; }
      h1 { margin-bottom: 6px; font: 38px Georgia, serif; }
      p { color: #677169; }
      label { display: grid; gap: 6px; margin: 22px 0; font-weight: 700; }
      input { padding: 10px; border: 1px solid #c8c4b9; border-radius: 7px; font: inherit; }
      small { color: #677169; font-weight: 400; }
      button { padding: 10px 18px; border: 0; border-radius: 7px; background: #17211b; color: white; cursor: pointer; font: inherit; font-weight: 700; }
      #status { margin-left: 10px; color: #246b52; }
    </style>
  </head>
  <body>
    <h1>X Agent Capture</h1>
    <p>Point the extension at the X Agent instance running on your computer or in your Codespace.</p>
    <label>
      X Agent URL
      <input id="agent-url" type="url" placeholder="http://localhost:3000">
      <small>Use the forwarded HTTPS URL when X Agent runs in a Codespace.</small>
    </label>
    <label>
      Import token (optional)
      <input id="import-token" type="password" autocomplete="off">
      <small>Only required when X_AGENT_IMPORT_TOKEN is configured for the app.</small>
    </label>
    <button id="save" type="button">Save settings</button><span id="status" role="status"></span>
    <script src="options.js"></script>
  </body>
</html>
